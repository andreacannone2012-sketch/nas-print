<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Stampa in rete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>
<body data-max-mb="{{ max_mb }}" data-exts="{{ exts }}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></symbol>
  <symbol id="i-remove" viewBox="0 0 24 24"><path d="M19 13H5v-2h14z"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 15.01l1.41 1.41L11 14.84V19h2v-4.16l1.59 1.59L16 15.01 12.01 11 8 15.01z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></symbol>
  <symbol id="i-err" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></symbol>
</svg>

<main class="app">
  <header class="bar">
    <div>
      <h1>Stampa in rete</h1>
      <p class="sub">{{ printer_name }} su {{ printer_host }}</p>
    </div>
    <div class="status" role="status" aria-live="polite">
      <span class="chip-s"><i id="sq" class="dot warn"></i><span id="status-text">Verifica in corso</span></span>
      <div id="toner" class="toner" hidden>
        <span>Toner <span id="toner-val"></span></span>
        <div class="lp"><i id="toner-fill"></i></div>
      </div>
    </div>
  </header>

  <form id="print-form" novalidate>
    <label id="dropzone" class="drop" for="file-input" tabindex="0">
      <svg class="ic big" aria-hidden="true"><use href="#i-upload"/></svg>
      <span class="drop-title">Scegli i documenti da stampare</span>
      <span class="drop-hint">Trascina i file qui o incollali con Ctrl+V. PDF, Word, PowerPoint, OpenDocument, TXT, PNG e JPG fino a {{ max_mb }} MB.</span>
      <span class="btn tonal st">Scegli file</span>
      <input id="file-input" type="file" multiple hidden accept="{{ accept }}">
    </label>
    <ul id="file-list" class="list" aria-label="File selezionati"></ul>

    <section class="card">
      <h2>Profili</h2>
      <div id="presets" class="presets"></div>
      <button type="button" id="save-toggle" class="text-btn st">
        <svg class="ic" aria-hidden="true"><use href="#i-bookmark"/></svg>Salva come profilo
      </button>
      <div id="save-row" class="save-row" hidden>
        <div class="tf grow">
          <input id="save-name" type="text" maxlength="20" placeholder=" " autocomplete="off">
          <label for="save-name">Nome del profilo</label>
        </div>
        <button type="button" id="save-go" class="btn tonal st">Salva</button>
      </div>
    </section>

    <section class="card">
      <h2>Impostazioni</h2>

      <div class="row2">
        <div class="copies">
          <button type="button" class="icon-btn tonal st" data-step="-1" aria-label="Una copia in meno"><svg class="ic" aria-hidden="true"><use href="#i-remove"/></svg></button>
          <div class="tf grow">
            <input id="copies" name="copies" type="number" inputmode="numeric" min="1" max="99" value="1" placeholder=" ">
            <label for="copies">Copie</label>
          </div>
          <button type="button" class="icon-btn tonal st" data-step="1" aria-label="Una copia in più"><svg class="ic" aria-hidden="true"><use href="#i-add"/></svg></button>
        </div>
        <div class="tf">
          <input id="page-ranges" name="page_ranges" type="text" autocomplete="off" placeholder=" ">
          <label for="page-ranges">Pagine da stampare</label>
          <span class="sup">Vuoto per tutte, oppure 1-3, 5</span>
        </div>
      </div>

      <label class="sw">
        <span class="sw-t"><strong>Fascicola le copie</strong><small>Ogni copia completa prima della successiva: 1-2-3, 1-2-3</small></span>
        <input id="collate" name="collate" type="checkbox" checked>
        <span class="track"></span>
      </label>

      <fieldset class="field">
        <legend>Fronte/retro</legend>
        <div class="seg">
          <label><input type="radio" name="sides" value="one-sided" checked><span><svg class="ic ck" aria-hidden="true"><use href="#i-check"/></svg>Solo fronte</span></label>
          <label><input type="radio" name="sides" value="two-sided-long-edge"><span><svg class="ic ck" aria-hidden="true"><use href="#i-check"/></svg>Lato lungo</span></label>
          <label><input type="radio" name="sides" value="two-sided-short-edge"><span><svg class="ic ck" aria-hidden="true"><use href="#i-check"/></svg>Lato corto</span></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Orientamento</legend>
        <div class="seg">
          <label><input type="radio" name="orientation" value="auto" checked><span><svg class="ic ck" aria-hidden="true"><use href="#i-check"/></svg>Auto</span></label>
          <label><input type="radio" name="orientation" value="portrait"><span><svg class="ic ck" aria-hidden="true"><use href="#i-check"/></svg>Verticale</span></label>
          <label><input type="radio" name="orientation" value="landscape"><span><svg class="ic ck" aria-hidden="true"><use href="#i-check"/></svg>Orizzontale</span></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Pagine per foglio</legend>
        <div class="seg">
          <label><input type="radio" name="number_up" value="1" checked><span><svg class="ic ck" aria-hidden="true"><use href="#i-check"/></svg>1</span></label>
          <label><input type="radio" name="number_up" value="2"><span><svg class="ic ck" aria-hidden="true"><use href="#i-check"/></svg>2</span></label>
          <label><input type="radio" name="number_up" value="4"><span><svg class="ic ck" aria-hidden="true"><use href="#i-check"/></svg>4</span></label>
        </div>
      </fieldset>

      <p id="summary" class="summary" aria-live="polite"></p>
    </section>
  </form>

  <div id="results" class="results" aria-live="polite"></div>

  <section class="card">
    <div class="head">
      <h2>In coda</h2>
      <span class="actions">
        <button id="cancel-all" type="button" class="text-btn st err" hidden>Annulla tutto</button>
        <button id="refresh" type="button" class="icon-btn st" aria-label="Aggiorna la coda"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg></button>
      </span>
    </div>
    <ul id="jobs" class="list"></ul>
    <p id="jobs-empty" class="empty">Nessun lavoro in coda.</p>
  </section>

  <div class="fab-bar">
    <button id="submit" class="fab st" type="submit" form="print-form" disabled>
      <svg class="ic" aria-hidden="true"><use href="#i-print"/></svg>
      <span id="submit-label">Stampa</span>
    </button>
  </div>
</main>

<script src="{{ url_for('static', filename='app.js') }}?v=3"></script>
</body>
</html>
