name: Build e pubblica immagine Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # Servono solo per build arm64 (vedi "platforms" sotto)
      - name: QEMU
        uses: docker/setup-qemu-action@v3

      - name: Metadati e tag (il nome immagine viene reso minuscolo)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ZimaOS su PC/mini-PC x86: amd64. Per ZimaBoard ARM o Raspberry usa:
          # platforms: linux/amd64,linux/arm64   (la build diventa molto piu' lenta)
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
